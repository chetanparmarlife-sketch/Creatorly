<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creatorly creator profile</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="side-panel">
    <header class="app-header">
      <div class="brand"><span class="mark"><i></i><i></i><i></i></span><span><strong>Creatorly</strong><small>Live creator profile</small></span></div>
      <span class="balance" id="balance"><i></i><b>—</b> credits</span>
    </header>
    <main id="content" aria-live="polite">
      <section class="state detecting"><span class="loader"></span><h1>Checking this profile…</h1><p>The panel updates as you move between supported creator pages.</p></section>
    </main>
    <footer class="app-footer">
      <button id="open-dashboard" class="text-action">Open dashboard <span aria-hidden="true">↗</span></button>
      <details>
        <summary>Connection settings <span aria-hidden="true">⌄</span></summary>
        <label><span class="sr-only">Dashboard URL</span><input id="dashboard-url" type="url" /></label>
        <label><span class="sr-only">Connection key</span><input id="connection-key" type="password" placeholder="Paste connection key" /></label>
        <button id="save-url">Save settings</button>
      </details>
    </footer>
    <script src="profile-url.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
