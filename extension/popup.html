<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creatorly</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand"><span class="mark"><i></i><i></i><i></i></span><span><strong>Creatorly</strong><small>Creator contact finder</small></span></div>
      <div class="header-tools"><span class="live-tab"><i></i> Following tab</span><span class="balance" id="balance"><b>—</b><small>credits</small></span></div>
    </header>
    <section class="workspace-context" id="workspace-context" aria-live="polite"><span class="workspace-dot"></span><span><small>Active CRM</small><strong>Checking workspace…</strong></span></section>
    <main id="content" aria-live="polite">
      <section class="state detecting">
        <span class="loader"></span>
        <h1>Checking this page…</h1>
        <p>Looking for an Instagram or YouTube creator profile.</p>
      </section>
    </main>
    <footer class="app-footer">
      <button id="open-dashboard" class="text-action"><span class="dashboard-mark" aria-hidden="true">⌘</span><span>Open Creatorly dashboard<small>Discovery, campaigns and saved profiles</small></span><b aria-hidden="true">↗</b></button>
      <details>
        <summary>Connection settings <span aria-hidden="true">⌄</span></summary>
        <label><span class="sr-only">Dashboard URL</span><input id="dashboard-url" type="url" /></label>
        <label><span class="sr-only">Connection key</span><input id="connection-key" type="password" placeholder="Paste connection key" /></label>
        <button id="save-url">Save settings</button>
      </details>
    </footer>
    <script src="profile-url.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
